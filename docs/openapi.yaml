openapi: 3.0.3
info:
  title: bpmninja Engine API
  description: |
    REST API for the bpmninja BPMN 2.0 Workflow Engine.
    
    Built with Axum (Rust). Supports BPMN process deployment, instance management,
    user/service task handling, message correlation, timer processing, and file attachments.

    When `BPMNINJA_API_KEY` is set, all endpoints except `GET /api/health` and
    `GET /api/ready` require `Authorization: Bearer <key>` or `X-API-Key: <key>`.
    Unset key means no authentication. XML/JSON bodies are capped at 10 MiB
    (`MAX_XML_BYTES`). `lockDuration` / `newDuration` are milliseconds.
  version: 0.7.25
  contact:
    name: bpmninja
  license:
    name: MIT

servers:
  - url: http://localhost:8081
    description: Local development server

security:
  - bearerAuth: []
  - apiKeyHeader: []
  - {}

tags:
  - name: Definitions
    description: Deploy, list, and manage BPMN process definitions
  - name: Instances
    description: Start, query, and manage process instances
  - name: User Tasks
    description: List and complete pending user tasks
  - name: Service Tasks
    description: Camunda-compatible fetch-and-lock external task API
  - name: Variables
    description: Read and update process instance variables
  - name: Files
    description: Upload and download file attachments on process instances
  - name: Messages & Timers
    description: Correlate messages and process expired timers
  - name: History
    description: Query the event history of process instances
  - name: Monitoring
    description: Health checks, readiness probes, engine statistics, and Prometheus metrics
  - name: Observability
    description: Live log buffer and SSE engine events

paths:
  # ─────────────────────────────── Definitions ───────────────────────────────

  /api/deploy:
    post:
      tags: [Definitions]
      summary: Deploy a BPMN definition
      description: |
        Parses and deploys a BPMN 2.0 XML definition. If a definition with the same 
        BPMN process ID already exists, a new version is created automatically.
        Maximum XML size: 10 MB.
        When `MODEL_CHECK` is `warn` or `enforce`, the success body includes
        `model_check`. That requires the `model-check` Cargo feature; the
        runtime default is `off` (field omitted). `enforce` returns 400 with
        `model_check` findings for a confirmed violation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployRequest'
      responses:
        '200':
          description: Definition deployed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployResponse'
        '400':
          description: |
            Invalid BPMN XML, or a model-check rejection (`MODEL_CHECK=enforce`).
            A rejection body is `ModelCheckError`: `error` lists the findings and
            `model_check` is the structured report. Timeout, panic, and a busy
            checker do not use this response; those deploys succeed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ModelCheckError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/deploy/collection:
    post:
      tags: [Definitions]
      summary: Deploy every executable pool in one commit
      description: |
        Deploys all top-level processes with `isExecutable="true"`, in document
        order, as one collection. Each pool is validated and, when `MODEL_CHECK`
        is `warn` or `enforce`, model-checked in isolation before anything is
        published. The response includes version-pinned collaboration metadata.
        Automatic internal message delivery is not enabled. The persisted record
        must fit the NATS maximum payload (often 1 MiB) even though the HTTP body
        may be up to 10 MiB. A lost response may already have committed; inspect
        definitions before retrying. `POST /api/deploy` is unchanged and still
        deploys one process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployRequest'
      responses:
        '200':
          description: Collection deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDeployResponse'
        '400':
          description: Invalid BPMN, empty collection, or model-check rejection of the whole batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          description: Persistence commit failed, including a payload that exceeds the broker limit. Nothing from the batch is published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/definitions:
    get:
      tags: [Definitions]
      summary: List all deployed definitions
      responses:
        '200':
          description: List of definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DefinitionInfo'

  /api/definitions/{id}:
    delete:
      tags: [Definitions]
      summary: Delete a process definition
      description: |
        Deletes a definition by its UUID key.
        Use `?cascade=true` to also delete all associated process instances.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: cascade
          in: query
          schema:
            type: boolean
            default: false
          description: If true, deletes all instances of this definition first
      responses:
        '204':
          description: Definition deleted
        '404':
          description: Definition not found
        '409':
          description: Definition has active instances (use cascade=true)

  /api/definitions/bpmn/{bpmn_id}:
    delete:
      tags: [Definitions]
      summary: Delete all versions of a BPMN process
      description: Deletes all definition versions matching the given BPMN process ID.
      parameters:
        - name: bpmn_id
          in: path
          required: true
          schema:
            type: string
          description: The BPMN process ID (not the UUID key)
      responses:
        '204':
          description: All versions deleted
        '404':
          description: No definitions found with this BPMN process ID

  /api/definitions/{id}/xml:
    get:
      tags: [Definitions]
      summary: Get the original BPMN XML of a definition
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: BPMN XML content as plain text
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No stored XML for this definition

  # ─────────────────────────────── Instances ─────────────────────────────────

  /api/start:
    post:
      tags: [Instances]
      summary: Start a new process instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
      responses:
        '200':
          description: Instance started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartResponse'
        '404':
          description: Definition not found
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/start/latest:
    post:
      tags: [Instances]
      summary: Start an instance of the latest version
      description: Starts a new instance using the latest version of a BPMN process definition identified by its BPMN process ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bpmn_process_id]
              properties:
                bpmn_process_id:
                  type: string
                  description: The BPMN process ID (not the UUID key). Legacy clients may send `bpmn_id`.
                business_key:
                  type: string
                  description: Optional business key stored on the instance.
                variables:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Instance started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartLatestResponse'
        '404':
          description: No definition found with this BPMN process ID
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/start/timer:
    post:
      tags: [Instances]
      summary: Start an instance from a timer start event
      description: Starts an instance whose start event carries a timerEventDefinition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
      responses:
        '200':
          description: Instance started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartResponse'
        '400':
          description: Definition has no timer start event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/instances:
    get:
      tags: [Instances]
      summary: List all process instances
      description: |
        Returns a page of process instances as a JSON array.
        Use `limit` and `offset` to paginate. The total number of instances
        (before pagination) is returned in the `X-Total-Count` header.
      parameters:
        - name: limit
          in: query
          description: Maximum number of instances to return.
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          description: Number of instances to skip.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: List of instances (JSON array; not wrapped in an object)
          headers:
            X-Total-Count:
              description: Total number of instances before pagination.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessInstance'

  /api/instances/{id}:
    get:
      tags: [Instances]
      summary: Get instance details
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Instance details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstance'
        '404':
          description: Instance not found
    delete:
      tags: [Instances]
      summary: Delete a process instance
      description: Deletes the instance and all associated pending tasks, timers, and file attachments.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Instance deleted
        '404':
          description: Instance not found

  /api/instances/{id}/incidents:
    get:
      tags: [Instances]
      summary: List instance incidents
      description: Returns the incidents of an instance, including already resolved ones.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: List of incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'
        '404':
          description: Instance not found

  /api/instances/{id}/incidents/{incident_id}/resolve:
    post:
      tags: [Instances]
      summary: Resolve an instance incident
      description: Resolves an incident manually and returns the updated incident.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveInstanceIncidentRequest'
      responses:
        '200':
          description: Incident resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '404':
          description: Instance or incident not found
        '409':
          description: Incident already resolved

  /api/instances/{id}/suspend:
    post:
      tags: [Instances]
      summary: Suspend a running instance
      description: Pauses timers and task completion. Variables and token moves remain allowed.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Instance suspended
        '404':
          description: Instance not found
        '409':
          description: Instance already in a terminal or suspended state

  /api/instances/{id}/resume:
    post:
      tags: [Instances]
      summary: Resume a suspended instance
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Instance resumed
        '404':
          description: Instance not found
        '409':
          description: Instance is not suspended

  /api/instances/{id}/move-token:
    post:
      tags: [Instances]
      summary: Move an instance token to another node
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_node_id]
              properties:
                target_node_id:
                  type: string
                variables:
                  type: object
                  additionalProperties: true
                  description: Optional variables applied to the target token.
                cancel_current:
                  type: boolean
                  default: true
                  description: Cancel the token's current position before moving it.
      responses:
        '204':
          description: Token moved
        '404':
          description: Instance or node not found
        '409':
          description: Operation blocked (e.g. suspended instance)
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/instances/{id}/migrate:
    post:
      tags: [Instances]
      summary: Migrate an instance to another definition version
      description: Changes `definition_key` and optionally remaps BPMN node IDs. Fails with 422 if a token would become orphaned.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_definition_key]
              properties:
                target_definition_key:
                  type: string
                  format: uuid
                node_mapping:
                  type: object
                  additionalProperties:
                    type: string
                  description: Optional old node ID → new node ID map
      responses:
        '204':
          description: Instance migrated
        '404':
          description: Instance or target definition not found
        '422':
          description: Orphaned token (unmapped node missing in target definition)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  # ─────────────────────────────── User Tasks ────────────────────────────────

  /api/tasks:
    get:
      tags: [User Tasks]
      summary: List all pending user tasks
      responses:
        '200':
          description: List of pending user tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingUserTask'

  /api/complete/{id}:
    post:
      tags: [User Tasks]
      summary: Complete a user task
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
      responses:
        '204':
          description: Task completed, process continued
        '409':
          description: Task not pending
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ────────────────────────────── Service Tasks ──────────────────────────────

  /api/service-tasks:
    get:
      tags: [Service Tasks]
      summary: List all pending service tasks
      responses:
        '200':
          description: List of service tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingServiceTask'

  /api/service-task/fetchAndLock:
    post:
      tags: [Service Tasks]
      summary: Fetch and lock service tasks
      description: |
        Camunda-compatible fetch-and-lock endpoint. Workers request tasks by topic,
        lock them for processing, and receive variable snapshots.
        
        Supports **long-polling** via `asyncResponseTimeout`. The server holds the
        connection open until a matching task becomes fetchable (created or unlocked),
        a lock expires, or the timeout elapses. `0` or omitted returns immediately.
        Values above 30000 milliseconds are clamped to 30000.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchAndLockRequest'
      responses:
        '200':
          description: Locked tasks (may be empty array if timeout expired)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingServiceTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/service-task/{id}/complete:
    post:
      tags: [Service Tasks]
      summary: Complete a service task
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteServiceTaskRequest'
      responses:
        '204':
          description: Task completed
        '404':
          description: Service task not found
        '409':
          description: Task locked by another worker
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/service-task/{id}/failure:
    post:
      tags: [Service Tasks]
      summary: Report a task failure
      description: Decrements the retry counter. At 0 retries, the task becomes an incident.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailServiceTaskRequest'
      responses:
        '204':
          description: Failure recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/service-task/{id}/extendLock:
    post:
      tags: [Service Tasks]
      summary: Extend the lock duration
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendLockRequest'
      responses:
        '204':
          description: Lock extended
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/service-task/{id}/bpmnError:
    post:
      tags: [Service Tasks]
      summary: Throw a BPMN error
      description: |
        Routes the token to the matching BoundaryErrorEvent (matched by `errorCode`).
        If no matching boundary event exists, returns an error.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BpmnErrorRequest'
      responses:
        '204':
          description: Error handled, token rerouted to boundary event
        '400':
          description: No matching boundary error event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/service-task/{id}/retry:
    post:
      tags: [Service Tasks]
      summary: Retry an incident
      description: Retries a failed service task that has become an incident.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryIncidentRequest'
      responses:
        '204':
          description: Retry scheduled
        '404':
          description: Service task not found
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/service-task/{id}/resolve:
    post:
      tags: [Service Tasks]
      summary: Resolve an incident
      description: Marks the incident resolved without completing the worker task.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveIncidentRequest'
      responses:
        '204':
          description: Incident resolved
        '404':
          description: Service task not found
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ────────────────────────────── Variables ───────────────────────────────────

  /api/instances/{id}/variables:
    put:
      tags: [Variables]
      summary: Update instance variables
      description: |
        Keys with non-null values are created or overwritten.
        Keys with `null` values are removed from the instance.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariablesRequest'
      responses:
        '204':
          description: Variables updated
        '404':
          description: Instance not found
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ─────────────────────────────── Files ─────────────────────────────────────

  /api/instances/{id}/files/{var_name}:
    post:
      tags: [Files]
      summary: Upload a file as a process variable
      description: |
        Upload a binary file as an instance variable (multipart field `file`).
        Size is limited by server config `MAX_UPLOAD_BYTES` (default 5 MiB); larger payloads return 413.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: var_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded
        '400':
          description: No file provided or invalid request
        '413':
          description: Upload exceeds MAX_UPLOAD_BYTES
    get:
      tags: [Files]
      summary: Download a file variable
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: var_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Variable is not a file
    delete:
      tags: [Files]
      summary: Delete a file variable
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: var_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: File deleted

  # ──────────────────────────── Messages & Timers ────────────────────────────

  /api/message:
    post:
      tags: [Messages & Timers]
      summary: Correlate a message
      description: |
        Correlates a message by `messageName`. Resumes waiting `MessageCatchEvent`s
        and starts new instances for matching `MessageStartEvent` definitions.
        Optional `businessKey` for targeted correlation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageName]
              properties:
                messageName:
                  type: string
                businessKey:
                  type: string
                variables:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Affected instance IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  affectedInstances:
                    type: array
                    items:
                      type: string
                      format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/timers/process:
    post:
      tags: [Messages & Timers]
      summary: Process expired timers
      description: |
        Scans for expired timers and resumes their instances.
        Note: The engine-server also runs an automatic background scheduler 
        (configurable via `TIMER_INTERVAL_MS`, default 1000ms).
      responses:
        '200':
          description: Number of processed timers
          content:
            application/json:
              schema:
                type: object
                properties:
                  triggered:
                    type: integer

  /api/timers:
    get:
      tags: [Messages & Timers]
      summary: List pending timers
      responses:
        '200':
          description: Pending timers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingTimer'

  /api/messages:
    get:
      tags: [Messages & Timers]
      summary: List pending message catch events
      responses:
        '200':
          description: Pending message catches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingMessage'

  /api/signal:
    post:
      tags: [Messages & Timers]
      summary: Broadcast a signal
      description: |
        Signals are broadcast without a business key. Resumes every waiting
        `SignalCatchEvent` with a matching `signalName` and starts new instances
        for matching `SignalStartEvent` definitions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signalName]
              properties:
                signalName:
                  type: string
                variables:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Affected instance IDs (deduplicated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  affectedInstances:
                    type: array
                    items:
                      type: string
                      format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/signals:
    get:
      tags: [Messages & Timers]
      summary: List pending signal catch events
      responses:
        '200':
          description: Pending signal catches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingSignal'

  # ─────────────────────────────── History ────────────────────────────────────

  /api/instances/{id}/history:
    get:
      tags: [History]
      summary: Query instance event history
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: event_types
          in: query
          schema:
            type: string
          description: Comma-separated event types filter
        - name: node_id
          in: query
          schema:
            type: string
        - name: actor_type
          in: query
          schema:
            type: string
            enum: [Engine, User, ServiceWorker, Timer, Listener]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of history events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryEntry'

  /api/instances/{id}/history/{event_id}:
    get:
      tags: [History]
      summary: Get a single history event
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: History event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryEntry'
        '404':
          description: Event not found

  # ──────────────────────────── Historical Instances ──────────────────────────

  /api/history/instances:
    get:
      tags: [History]
      summary: Query archived (completed) process instances
      description: |
        Returns instances that have reached a terminal state (Completed,
        CompletedWithError, Terminated) and were moved to the history archive.
      parameters:
        - name: definition_key
          in: query
          schema:
            type: string
            format: uuid
        - name: business_key
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: ISO-8601 lower bound (inclusive) for completed_at.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: ISO-8601 upper bound (exclusive) for completed_at.
          schema:
            type: string
            format: date-time
        - name: state
          in: query
          description: Terminal-state filter.
          schema:
            type: string
            enum: [completed, error]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Matching archived instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessInstance'

  /api/history/instances/{id}:
    get:
      tags: [History]
      summary: Get a single archived instance by id
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Archived instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstance'
        '404':
          description: Not found

  # ──────────────────────────── Monitoring & Health ───────────────────────────

  /api/health:
    get:
      tags: [Monitoring]
      summary: Liveness check
      description: Always returns 200 OK if the server is running. Public even when `BPMNINJA_API_KEY` is set.
      security: []
      responses:
        '200':
          description: Server is alive

  /api/ready:
    get:
      tags: [Monitoring]
      summary: Readiness check
      description: Returns 200 if the server is ready. Returns 503 if NATS is disconnected. Public even when `BPMNINJA_API_KEY` is set.
      security: []
      responses:
        '200':
          description: Server is ready
        '503':
          description: NATS connection lost

  /api/info:
    get:
      tags: [Monitoring]
      summary: Backend information
      responses:
        '200':
          description: Backend type, NATS URL, and connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendInfo'

  /api/monitoring:
    get:
      tags: [Monitoring]
      summary: Engine statistics and storage info
      responses:
        '200':
          description: Monitoring data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringData'

  /api/monitoring/buckets/{bucket}/entries:
    get:
      tags: [Monitoring]
      summary: List KV bucket entries
      description: Lists all entries in a NATS KV bucket for diagnostic purposes.
      parameters:
        - name: bucket
          in: path
          required: true
          schema:
            type: string
          description: Name of the NATS KV bucket
      responses:
        '200':
          description: List of key-value entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BucketEntry'

  /api/monitoring/buckets/{bucket}/entries/{key}:
    get:
      tags: [Monitoring]
      summary: Get a single KV bucket entry
      description: Returns the value of a specific key in a NATS KV bucket.
      parameters:
        - name: bucket
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entry value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketEntryDetail'
        '404':
          description: Key not found

  /api/logs:
    get:
      tags: [Observability]
      summary: Query the in-memory log buffer
      description: |
        Returns a filtered snapshot of the rolling log buffer (newest first).
        Default limit 500, hard cap 5000.
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [error, warn, info, debug, trace]
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive substring on message and target
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        '200':
          description: Log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'

  /api/events:
    get:
      tags: [Observability]
      summary: Server-Sent Events for engine state changes
      description: |
        Stream of `instance_changed`, `task_changed`, and `definition_changed`.
        Broadcast capacity is 256; slow clients may miss events and should re-fetch via REST.
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /metrics:
    get:
      tags: [Monitoring]
      summary: Prometheus metrics
      description: |
        Prometheus text format. The route is only mounted when the Prometheus
        recorder is installed at process start.
      responses:
        '200':
          description: Metrics scrape
          content:
            text/plain:
              schema:
                type: string

# ═══════════════════════════════ Components ═══════════════════════════════════

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: |
        Shared API key via `Authorization: Bearer <key>`.
        Required only when the server is started with `BPMNINJA_API_KEY`.
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Alternative to Bearer. Required only when `BPMNINJA_API_KEY` is set.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the resource

  responses:
    BadRequest:
      description: Malformed request (invalid JSON syntax, bad UUID, invalid BPMN XML)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request body exceeds the configured limit (default 10 MiB)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Missing or unsupported `Content-Type` (expected `application/json`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Body is valid JSON but does not match the request schema
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    DeployRequest:
      type: object
      required: [xml, name]
      properties:
        xml:
          type: string
          description: BPMN 2.0 XML content (max 10MB)
        name:
          type: string
          description: Human-readable name for the definition

    DeployResponse:
      type: object
      required: [definition_key, version]
      properties:
        definition_key:
          type: string
          format: uuid
        version:
          type: integer
          description: Newly created definition version (starts at 1).
        model_check:
          $ref: '#/components/schemas/ModelCheckReport'

    CollectionDeployResponse:
      type: object
      required: [collection_id, processes, collaborations]
      properties:
        collection_id:
          type: string
          format: uuid
        processes:
          type: array
          items:
            $ref: '#/components/schemas/CollectionProcessResult'
        collaborations:
          type: array
          items:
            $ref: '#/components/schemas/Collaboration'

    CollectionProcessResult:
      type: object
      required: [process_id, definition_key, version]
      properties:
        process_id:
          type: string
        definition_key:
          type: string
          format: uuid
        version:
          type: integer
        model_check:
          $ref: '#/components/schemas/ModelCheckReport'

    Collaboration:
      type: object
      required: [id, participants, message_flows]
      properties:
        id:
          type: string
        participants:
          type: array
          items:
            $ref: '#/components/schemas/CollaborationParticipant'
        message_flows:
          type: array
          items:
            $ref: '#/components/schemas/CollaborationMessageFlow'

    CollaborationParticipant:
      type: object
      required: [id, process_id, executable]
      properties:
        id:
          type: string
        process_id:
          type: string
          nullable: true
        executable:
          type: boolean

    CollaborationMessageFlow:
      type: object
      required: [id, message_id, message_name, source, target]
      properties:
        id:
          type: string
        message_id:
          type: string
        message_name:
          type: string
        source:
          $ref: '#/components/schemas/CollaborationEndpoint'
        target:
          $ref: '#/components/schemas/CollaborationEndpoint'

    CollaborationEndpoint:
      type: object
      required: [participant_id, process_id, element_id]
      properties:
        participant_id:
          type: string
        process_id:
          type: string
        element_id:
          type: string

    ModelCheckError:
      type: object
      description: |
        `MODEL_CHECK=enforce` rejected the deploy. `error` repeats the findings
        as text; `model_check` is the structured report.
      required: [error, model_check]
      properties:
        error:
          type: string
        model_check:
          $ref: '#/components/schemas/ModelCheckReport'

    ModelCheckReport:
      type: object
      description: |
        Deploy-time model checking (`rust_bpmn_analyzer`). Omitted when
        `MODEL_CHECK=off` (the default).
      required: [status]
      properties:
        status:
          type: string
          enum:
            - passed
            - violations
            - skipped
            - inconclusive
            - failed
            - unavailable
        violations:
          type: array
          items:
            type: object
            required: [property, elements]
            properties:
              property:
                type: string
                enum:
                  - safeness
                  - option_to_complete
                  - proper_completion
                  - no_dead_activities
              elements:
                type: array
                items:
                  type: string
        reason:
          type: string
          description: Why the check was skipped, inconclusive, failed, or unavailable.

    StartRequest:
      type: object
      required: [definition_key]
      properties:
        definition_key:
          type: string
          format: uuid
        business_key:
          type: string
          description: Optional business key stored on the instance.
        variables:
          type: object
          additionalProperties: true

    StartResponse:
      type: object
      required: [instance_id]
      properties:
        instance_id:
          type: string
          format: uuid

    StartLatestResponse:
      type: object
      required: [instance_id, definition_key, version]
      properties:
        instance_id:
          type: string
          format: uuid
        definition_key:
          type: string
          format: uuid
        version:
          type: integer
          description: Version of the definition that was started.

    CompleteRequest:
      type: object
      properties:
        variables:
          type: object
          additionalProperties: true

    UpdateVariablesRequest:
      type: object
      required: [variables]
      properties:
        variables:
          type: object
          additionalProperties: true

    IncidentKind:
      type: string
      enum: [service_task, timer, persistence, bpmn_error]

    Incident:
      type: object
      required: [id, kind, message, created_at, last_seen_at, occurrences]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/IncidentKind'
        node_id:
          type: string
          nullable: true
        task_id:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
        details:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        occurrences:
          type: integer
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          type: string
          nullable: true

    ResolveInstanceIncidentRequest:
      type: object
      properties:
        resolvedBy:
          type: string
          description: Optional identifier of the operator resolving the incident.

    RetryIncidentRequest:
      type: object
      properties:
        retries:
          type: integer
          description: Retries to restore before the task is offered again.

    ResolveIncidentRequest:
      type: object
      properties:
        variables:
          type: object
          additionalProperties: true
          description: Variables written before the incident is resolved.

    DefinitionInfo:
      type: object
      properties:
        key:
          type: string
          format: uuid
        bpmn_id:
          type: string
        version:
          type: integer
        node_count:
          type: integer
        is_latest:
          type: boolean
          description: True for the highest deployed version of this BPMN process.

    ProcessInstance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        definition_key:
          type: string
          format: uuid
        business_key:
          type: string
        parent_instance_id:
          type: string
          format: uuid
          nullable: true
        state:
          type: object
          description: InstanceState enum (Running, WaitingOnUserTask, Completed, etc.)
        current_node:
          type: string
        audit_log:
          type: array
          items:
            type: string
        variables:
          type: object
          additionalProperties: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/Incident'

    PendingUserTask:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        node_id:
          type: string
        assignee:
          type: string
        token_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        business_key:
          type: string
          nullable: true

    PendingTimer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        node_id:
          type: string
        expires_at:
          type: string
          format: date-time
        token_id:
          type: string
          format: uuid
        timer_def:
          type: object
          nullable: true
          description: Original timer definition (used for recurring timers).
        remaining_repetitions:
          type: integer
          nullable: true
          description: Remaining repetitions for repeating-interval timers.

    PendingMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        node_id:
          type: string
        message_name:
          type: string
        token_id:
          type: string
          format: uuid

    PendingSignal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        node_id:
          type: string
        signal_name:
          type: string
        token_id:
          type: string
          format: uuid

    PendingServiceTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        definition_key:
          type: string
          format: uuid
        node_id:
          type: string
        topic:
          type: string
        token_id:
          type: string
          format: uuid
        variables_snapshot:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        worker_id:
          type: string
          nullable: true
        lock_expiration:
          type: string
          format: date-time
          nullable: true
        retries:
          type: integer
        error_message:
          type: string
          nullable: true
        error_details:
          type: string
          nullable: true
        business_key:
          type: string
          nullable: true

    FetchAndLockRequest:
      type: object
      required: [workerId, maxTasks, topics]
      properties:
        workerId:
          type: string
        maxTasks:
          type: integer
        topics:
          type: array
          items:
            type: object
            required: [topicName, lockDuration]
            properties:
              topicName:
                type: string
              lockDuration:
                type: integer
                description: Lock duration in milliseconds
        asyncResponseTimeout:
          type: integer
          minimum: 0
          description: |
            Long-poll timeout in milliseconds. Omitted or 0 returns after a single fetch.
            Otherwise the server waits until a matching task is fetchable, a lock expires,
            or this timeout elapses. Values above 30000 are clamped to 30000.

    CompleteServiceTaskRequest:
      type: object
      required: [workerId]
      properties:
        workerId:
          type: string
        variables:
          type: object
          additionalProperties: true

    FailServiceTaskRequest:
      type: object
      required: [workerId]
      properties:
        workerId:
          type: string
        retries:
          type: integer
        errorMessage:
          type: string
        errorDetails:
          type: string

    ExtendLockRequest:
      type: object
      required: [workerId, newDuration]
      properties:
        workerId:
          type: string
        newDuration:
          type: integer
          description: New lock duration in milliseconds

    BpmnErrorRequest:
      type: object
      required: [workerId, errorCode]
      properties:
        workerId:
          type: string
        errorCode:
          type: string

    HistoryEntry:
      type: object
      required: [id, instance_id, timestamp, event_type, description, actor_type, context, is_snapshot]
      properties:
        id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        event_type:
          type: string
          enum:
            - InstanceStarted
            - InstanceCompleted
            - InstanceDeleted
            - TaskCompleted
            - VariableUpdated
            - GatewayTaken
            - ListenerExecuted
            - TokenAdvanced
            - TokenForked
            - TokenJoined
            - BranchCompleted
            - Error
            - CallActivityStarted
            - CallActivityCompleted
            - InstanceSuspended
            - InstanceResumed
            - TokenMoved
            - EscalationThrown
            - CompensationTriggered
            - InstanceMigrated
        node_id:
          type: string
          nullable: true
        description:
          type: string
        actor_type:
          type: string
          enum: [Engine, User, ServiceWorker, Timer, Listener]
        actor_id:
          type: string
          nullable: true
        diff:
          $ref: '#/components/schemas/HistoryDiff'
        context:
          type: object
          additionalProperties: true
          description: Event-specific structured context.
        metadata:
          nullable: true
          description: Optional free-form event metadata.
        definition_version:
          type: integer
          nullable: true
          description: Definition version active when the event was recorded.
        is_snapshot:
          type: boolean
        full_state_snapshot:
          nullable: true
          description: Full instance state captured for snapshot events.

    HistoryDiff:
      type: object
      nullable: true
      properties:
        variables:
          type: object
          nullable: true
          properties:
            added:
              type: object
              additionalProperties: true
            removed:
              type: array
              items:
                type: string
            changed:
              type: object
              additionalProperties: true
        status:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 2
          nullable: true
          description: "[old_status, new_status]"
        current_node:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 2
          nullable: true
          description: "[old_node, new_node]"
        human_readable:
          type: string
          nullable: true

    BackendInfo:
      type: object
      properties:
        backend_type:
          type: string
        nats_url:
          type: string
          nullable: true
        connected:
          type: boolean
        storage_status:
          $ref: '#/components/schemas/StorageStatus'

    StorageStatus:
      type: object
      required: [state, detail]
      properties:
        state:
          type: string
          enum: [ready, failed, in-memory]
        detail:
          type: string
          description: Human-readable bootstrap summary or failure cause.

    MonitoringData:
      type: object
      properties:
        definitions_count:
          type: integer
        instances_total:
          type: integer
        instances_running:
          type: integer
        instances_completed:
          type: integer
        pending_user_tasks:
          type: integer
        pending_service_tasks:
          type: integer
        pending_timers:
          type: integer
        pending_message_catches:
          type: integer
        persistence_errors:
          type: integer
        storage_info:
          type: object
          nullable: true
          properties:
            backend_name:
              type: string
            version:
              type: string
            host:
              type: string
            port:
              type: integer
            memory_bytes:
              type: integer
            storage_bytes:
              type: integer
            streams:
              type: integer
            consumers:
              type: integer
            buckets:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  bucket_type:
                    type: string
                  entries:
                    type: integer
                  size_bytes:
                    type: integer
        storage_status:
          $ref: '#/components/schemas/StorageStatus'

    BucketEntry:
      type: object
      required: [key]
      properties:
        key:
          type: string
        size_bytes:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    BucketEntryDetail:
      type: object
      required: [key, data, encoding]
      properties:
        key:
          type: string
        data:
          type: string
          description: JSON/text payload, or Base64 when `encoding` is `base64`.
        encoding:
          type: string
          enum: [utf8, base64]

    LogEntry:
      type: object
      required: [timestamp, level, target, message]
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
        target:
          type: string
        message:
          type: string
