[package]
name = "engine-server"
version = "0.7.24"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version.workspace = true

[dependencies]
# Deploy-time model checking (V1). Not on crates.io → pinned git revision (MIT).
rust_bpmn_analyzer = { git = "https://github.com/timKraeuter/rust_bpmn_analyzer", rev = "3d3eede32409d70e6818d8344d480de8d76a6d8b" }
# Same version as bpmn-parser; used to normalize XML for the analyzer.
quick-xml = "0.42"
axum = { version = "0.8", features = ["multipart", "tokio"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { version = "0.7", features = ["cors"] }
engine-core = { path = "../engine-core" }
bpmn-parser = { path = "../bpmn-parser" }
persistence-nats = { path = "../persistence-nats" }
async-nats = "0.50"
futures = "0.3"
uuid = { version = "1.23", features = ["v4", "serde"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { version = "0.4.44", features = ["serde"] }

# Observability — Prometheus metrics
# Note: opentelemetry-prometheus is officially discontinued (v0.31).
# The `metrics` ecosystem is the idiomatic Rust choice for Prometheus export.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2.4"
tower = "0.5"
pin-project-lite = "0.2"
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "multipart"] }
tokio = { workspace = true }

