# cargo-deny — pragmatische Supply-Chain-Prüfung für den Workspace.
# https://embarkstudios.github.io/cargo-deny/
#
# Ziel: neue Advisories deny; Yanked/Duplicates/Wildcards warn;
# Lizenzen Allow-List (typische Rust-Lizenzen + TLS/MPL).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false

[advisories]
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # TLS-Stack (ring / webpki-roots) — de-facto üblich in Rust
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "0BSD",
    "CC0-1.0",
    # smartstring (rhai) — MPL-2.0+
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
