[package]
name = "persistence-nats"
version = "0.7.24"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version.workspace = true

[features]
default = []
compact-instances = []
separate-audit-log = []

delta-instances = []

[dependencies]
engine-core = { path = "../engine-core" }
async-nats = "0.50"
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { version = "1", features = ["derive"] }
futures = "0.3.32"
uuid = "1.23.2"
tracing = { workspace = true }
async-trait = "0.1.89"
chrono = "0.4.44"
base64 = "0.23.1"
# Always retain the decoder so disabling compact writes permits rollback.
rmp-serde = "1.3.1"
sha2 = "0.10.9"

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "nats_bench"
harness = false
