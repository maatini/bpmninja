[project]
name = "documentation-crew"
version = "0.1.0"
description = "Hierarchisches CrewAI-Team für professionelle technische Dokumentation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=1.0,<2",
    "crewai-tools>=1.0,<2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
documentation-crew = "documentation_crew.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documentation_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
