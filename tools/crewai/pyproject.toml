[project]
name = "bpmninja-crew"
version = "0.1.0"
description = "CrewAI-Analyse- und Umsetzungs-Crew für BPMNinja"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=1.0,<2",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
bpmninja-crew = "bpmninja_crew.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bpmninja_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
