name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, der veröffentlicht werden soll (z. B. v0.7.25)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Release vorbereiten
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Tag statt Workflow-Ref auschecken, damit auch ein manuell gestarteter
          # Lauf den Stand des Tags baut und nicht den aktuellen Branch.
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Versionen prüfen
        run: node tools/sync-version.mjs --check

      - name: Tag gegen version.json prüfen
        run: |
          node -e '
          const fs = require("node:fs");
          const expected = String(process.env.TAG).replace(/^v/, "");
          const version = JSON.parse(fs.readFileSync("version.json", "utf8")).version;
          if (version !== expected) {
            console.error(`::error::version.json enthält ${version}, Tag ${process.env.TAG} erwartet ${expected}.`);
            process.exit(1);
          }
          console.log(`version.json (${version}) passt zu ${process.env.TAG}.`);
          '

      - name: Tauri-Plugin-Parität prüfen
        run: node desktop-tauri/scripts/assert-tauri-parity.mjs

      - name: Release anlegen oder finden
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits."
          else
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "BPMNinja $TAG"
          fi
          release_id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            name: linux
            target: x86_64-unknown-linux-gnu

          # Windows
          - os: windows-latest
            name: windows
            target: x86_64-pc-windows-msvc

          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            name: macos-arm
            target: aarch64-apple-darwin

          # macOS Intel (x86_64)
          - os: macos-15-intel
            name: macos-intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install UI Dependencies
        working-directory: desktop-tauri
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-tauri
          tagName: ${{ env.TAG }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Draft bleibt bestehen, bis alle Targets gebaut und Prüfsummen
          # hochgeladen sind; der publish-Job veröffentlicht am Ende.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Prüfsummen erzeugen
        run: node tools/release-checksums.mjs --target "${{ matrix.target }}" --name "${{ matrix.name }}"

      - name: Prüfsummen hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.TAG }}" "bpmninja-${{ matrix.name }}.sha256" --clobber

  publish:
    name: Release veröffentlichen
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Draft veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false
