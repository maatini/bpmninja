name: Desktop Packages

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop-tauri/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/desktop-packages.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'desktop-tauri/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/desktop-packages.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  packages:
    uses: ./.github/workflows/desktop-packages.yml

  release:
    name: Attach installers to draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: packages

      - name: Create draft and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            python -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to modify a published release"'
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft "${prerelease[@]}" \
              --title "bpmninja-desktop $RELEASE_TAG" \
              --notes "Desktop installers for Linux x64, Windows x64, and macOS Intel and Apple Silicon."
          fi
          mapfile -d '' installers < <(find packages -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -print0)
          test "${#installers[@]}" -eq 6
          gh release upload "$RELEASE_TAG" "${installers[@]}" --clobber
