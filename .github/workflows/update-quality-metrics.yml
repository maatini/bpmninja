name: Update Quality Metrics

on:
  # Wöchentlich montags um 04:00 UTC
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Metriken laufen gesammelt und schreiben nur auf den metrics-Branch.
concurrency:
  group: update-quality-metrics
  cancel-in-progress: false

jobs:
  update-metrics:
    name: Qualitätsmetriken zusammenführen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Mutation-Metriken herunterladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p incoming-metrics/mutation
          if ! run_id="$(gh run list --workflow "Core Mutation Tests" --status completed --limit 1 --json databaseId --jq '.[0].databaseId')"; then
            echo "::warning::Lauf-Liste für 'Core Mutation Tests' konnte nicht abgerufen werden."
            exit 0
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::warning::Kein abgeschlossener Lauf für 'Core Mutation Tests' gefunden."
            exit 0
          fi
          echo "Lade Mutation-Metriken aus Run ${run_id}."
          if ! gh run download "$run_id" --pattern "*-metrics" --dir incoming-metrics/mutation; then
            echo "::warning::Artefakte für 'Core Mutation Tests' (Run ${run_id}) konnten nicht geladen werden."
          fi

      - name: Fuzz-Metriken herunterladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p incoming-metrics/fuzz
          if ! run_id="$(gh run list --workflow "Fuzz Testing" --status completed --limit 1 --json databaseId --jq '.[0].databaseId')"; then
            echo "::warning::Lauf-Liste für 'Fuzz Testing' konnte nicht abgerufen werden."
            exit 0
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::warning::Kein abgeschlossener Lauf für 'Fuzz Testing' gefunden."
            exit 0
          fi
          echo "Lade Fuzz-Metriken aus Run ${run_id}."
          if ! gh run download "$run_id" --pattern "*-metrics" --dir incoming-metrics/fuzz; then
            echo "::warning::Artefakte für 'Fuzz Testing' (Run ${run_id}) konnten nicht geladen werden."
          fi

      - name: Metriken zusammenführen und README-Block aktualisieren
        run: python3 .github/scripts/merge_quality_metrics.py

      - name: Auf metrics-Branch committen und pushen
        run: bash .github/scripts/commit-and-push-quality-metrics.sh
