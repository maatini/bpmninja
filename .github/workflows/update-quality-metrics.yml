name: Update Quality Metrics

on:
  workflow_run:
    workflows:
      - Fuzz Testing
      - Core Mutation Tests
    types:
      - completed

permissions:
  contents: write
  actions: read

# Serialize metrics updates so two workflow_run jobs do not
# commit against the same stale main and reject each other.
concurrency:
  group: update-quality-metrics
  cancel-in-progress: false

jobs:
  update-metrics:
    name: Merge quality metrics and update README
    # Mutation workflow uses continue-on-error; also merge when the run failed
    # but still produced metrics artifacts (partial success).
    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download metrics artifacts from triggering run
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: "*-metrics"
          path: incoming-metrics
          merge-multiple: true

      - name: Merge metrics and update README block
        run: python3 .github/scripts/merge_quality_metrics.py

      - name: Commit and push if changed
        run: bash .github/scripts/commit-and-push-quality-metrics.sh
