name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nx dient hier ausschließlich der Ermittlung betroffener Projekte; die Jobs
  # führen ihre Schritte direkt mit cargo/npm aus. Bewusst kein Nx-Cache in CI:
  # actions/cache, sccache und rust-cache übernehmen die Beschleunigung, und ein
  # Nx-Cache könnte bei den Client-Integrationstests veraltete Erfolge melden.
  plan:
    name: Affected projects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.affected.outputs.projects }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Nx
        run: npm ci

      - name: Derive affected base and head SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Determine affected projects
        id: affected
        run: |
          # Target-Filter verhindert, dass das Root-Projekt `rust` bei reinen
          # Doku-Änderungen als betroffen gilt. Nx ordnet Dateien dem tiefsten
          # Projekt-Root zu; ohne Filter besitzt `rust` (root `.`) auch README/docs.
          # Die gefilterten Target-Namen stammen aus den Target-Inputs in nx.json.
          projects=$(npx nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" \
            --with-target=fmt --with-target=clippy --with-target=test --with-target=deny \
            --with-target=lint --with-target=typecheck --with-target=build --with-target=e2e \
            --with-target=tauri:build --with-target=compile --with-target=check \
            | paste -sd, -)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Affected projects: ${projects:-<none>}"

      - name: Check version consistency
        run: node tools/sync-version.mjs --check

      - name: Check documentation links and versions
        run: node tools/check-docs.mjs

      - name: Delivered OpenAPI gegen TypeSpec prüfen
        run: node tools/check-openapi-parity.mjs

  rust:
    name: Rust clippy and tests
    needs: plan
    if: contains(format(',{0},', needs.plan.outputs.projects), ',rust,')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      nats:
        image: nats:alpine
        command: "-js -m 8222"
        ports:
          - 4222:4222
          - 8222:8222
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      NATS_URL: nats://127.0.0.1:4222
      # Jeder Test-Stream reserviert sein max_bytes im JetStream-Konto. 64 MiB
      # statt 1 GiB verhindert, dass die vielen Test-Streams das Storage-Limit
      # des CI-NATS aufbrauchen.
      BPMNINJA_STREAM_MAX_BYTES: "67108864"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.99.0 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Wait for NATS JetStream
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              echo "NATS ready"
              exit 0
            fi
            sleep 1
          done
          echo "NATS failed to become ready"
          exit 1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace

  coverage:
    name: Rust line coverage
    needs: plan
    if: contains(format(',{0},', needs.plan.outputs.projects), ',rust,')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      nats:
        image: nats:alpine
        command: "-js -m 8222"
        ports:
          - 4222:4222
          - 8222:8222
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      NATS_URL: nats://127.0.0.1:4222
      BPMNINJA_STREAM_MAX_BYTES: "67108864"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.99.0 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Wait for NATS JetStream
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              echo "NATS ready"
              exit 0
            fi
            sleep 1
          done
          echo "NATS failed to become ready"
          exit 1

      - name: Measure coverage
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info --fail-under-lines 75

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: warn
          retention-days: 30

  external-task-client:
    name: External task client tests
    needs: plan
    if: contains(format(',{0},', needs.plan.outputs.projects), ',client,')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bpmn-ninja-external-task-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bpmn-ninja-external-task-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript lint
        run: npm run lint

      - name: Install Rust 1.99.0 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build engine-server for integration test
        working-directory: .
        run: cargo build -p engine-server

      - name: Run tests (incl. real engine-server integration)
        env:
          BPMNINJA_SERVER_BIN: ${{ github.workspace }}/target/debug/engine-server
        run: npm test

  typespec:
    name: TypeSpec compile
    needs: plan
    if: contains(format(',{0},', needs.plan.outputs.projects), ',api-spec,')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api-spec/package-lock.json

      - name: Install dependencies
        working-directory: api-spec
        run: npm ci

      - name: Compile TypeSpec
        working-directory: api-spec
        run: npm run compile

      - name: Delivered OpenAPI gegen TypeSpec prüfen
        run: node tools/check-openapi-parity.mjs

      - name: Fail on drifted generated spec
        run: git diff --exit-code api-spec/tsp-output

  cargo-deny:
    name: cargo deny
    needs: plan
    if: contains(format(',{0},', needs.plan.outputs.projects), ',rust,')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.99.0 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.30
        with:
          tool: cargo-deny

      - name: Run cargo deny check
        run: cargo deny check

  desktop-frontend:
    name: Desktop frontend lint, build, and E2E
    needs: plan
    if: contains(format(',{0},', needs.plan.outputs.projects), ',desktop,')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Assert TypeScript peer range
        working-directory: desktop-tauri
        run: npm run test:deps

      - name: Install dependencies
        working-directory: desktop-tauri
        run: npm ci

      - name: Run lint
        working-directory: desktop-tauri
        run: npm run lint

      - name: Build frontend bundle
        working-directory: desktop-tauri
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('desktop-tauri/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: desktop-tauri
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: desktop-tauri
        run: npm run test:e2e

  desktop-build:
    name: Desktop backend check
    needs: plan
    if: contains(format(',{0},', needs.plan.outputs.projects), ',desktop,')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust 1.99.0 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Assert Tauri dependency parity
        run: node desktop-tauri/scripts/assert-tauri-parity.mjs

      - name: Check Tauri backend
        run: cargo check --manifest-path desktop-tauri/src-tauri/Cargo.toml

  ci-scripts:
    name: CI helper scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test quality-metrics parsers
        run: python3 .github/scripts/tests/test_mutation_metrics.py
